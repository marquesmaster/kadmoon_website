services:
  db:
    image: postgres:16-alpine
    container_name: kadmoon-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kadmoon
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=kadmoon
    volumes:
      - kadmoon-db-data:/var/lib/postgresql/data
    # Not published to the host: only the app container (same network) reaches it.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kadmoon -d kadmoon']
      interval: 10s
      timeout: 5s
      retries: 5

  kadmoon:
    build: .
    image: kadmoon-website:latest
    container_name: kadmoon-website
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bind to localhost only. Nginx on the host reverse-proxies to this port.
    # Change 3005 if another site already uses it.
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://kadmoon:${POSTGRES_PASSWORD}@db:5432/kadmoon?schema=public
      # Salt for hashing lead IPs (set a random value in .env).
      - LEAD_IP_SALT=${LEAD_IP_SALT:-change-me}
      # Email provider (first one set wins): Web3Forms, then Resend, then SMTP.
      - WEB3FORMS_ACCESS_KEY=${WEB3FORMS_ACCESS_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - CONTACT_TO=${CONTACT_TO:-comercial@kadmoon.com}
      - CONTACT_FROM=${CONTACT_FROM:-}

volumes:
  kadmoon-db-data:
