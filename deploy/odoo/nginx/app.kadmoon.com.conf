# Nginx reverse proxy for the Odoo back-office at app.kadmoon.com.
# Put this in /etc/nginx/sites-available/, symlink into sites-enabled/, then
# run certbot to obtain the certificate (see README.md). Certbot will fill in
# the ssl_certificate lines and the port 443 server block on first run; the
# HTTP block below is enough for `certbot --nginx` to start from.

upstream odoo {
    server 127.0.0.1:8069;
}
upstream odoo_websocket {
    server 127.0.0.1:8072;
}

server {
    listen 80;
    server_name app.kadmoon.com;

    # Max upload size for attachments/imports.
    client_max_body_size 100m;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websocket / longpolling (Discuss, live notifications).
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    # Cache static assets served by Odoo.
    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 90m;
        expires 90d;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
